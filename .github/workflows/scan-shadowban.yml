name: Scan shadowban

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: va-manager-shadowban-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 68
    steps:
      - name: Trigger VA Manager shadowban scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub secret CRON_SECRET"
            exit 1
          fi

          failures=0
          for cycle in 1 2 3 4 5 6; do
            echo "Starting scan cycle $cycle/6"
            if ! curl --fail --show-error --silent \
              --max-time 290 \
              --retry 2 \
              --retry-delay 20 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://va.taplinkr.com/api/scan-shadowban"; then
              failures=$((failures + 1))
              echo "Scan cycle $cycle failed; the next cycle will still run."
            fi
            echo
            if [ "$cycle" -lt 6 ]; then
              sleep 480
            fi
          done

          if [ "$failures" -eq 6 ]; then
            echo "All scan cycles failed."
            exit 1
          fi
